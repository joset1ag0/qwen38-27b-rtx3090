# Qwen3.8-27B on one RTX 3090, containerized. See docs/docker.md.
#
#   docker compose --profile single up -d     # low latency: MTP speculative decoding
#   docker compose --profile batch  up -d     # throughput
#   docker compose run --rm prepare           # just download + requantize the model
#   docker compose run --rm single verify     # verify.sh inside the container
#
# Knobs go in a .env file next to this file (never committed): VLLM_API_KEY=...,
# and any of the start-script variables (CTX, KV, MAX_LEN, MAX_SEQS, GPU_UTIL, VISION,
# SPEC_ATTN, DRAFT_TOKENS, EXTRA_ARGS, ...) — .env is passed straight into the
# container. Fastest single-user decode, if the card is yours alone (README,
# "If you are the only user"; the drafter it needs is already downloaded by
# prepare):
#
#   printf 'SPEC=dflash2\nDFLASH_TOKENS=15\nPREFIX_CACHE=1\n' >> .env
#
# On WSL2 add VLLM_WSL2_ENABLE_PIN_MEMORY=1 to that .env: SPEC=dflash2 forces vLLM's
# V2 model runner, whose UVA buffers are refused there by default, and the container
# aborts at "RuntimeError: UVA is not available" before loading weights (docs/docker.md).
# BIND (default 127.0.0.1; 0.0.0.0 to serve the LAN), PORT and MODELS_DIR are read
# here: models live in ./models by default
# (the same layout as the venv install, so both can share one download).
# One GPU: run either "single" or "batch", not both.

x-qwen: &qwen
  # Prebuilt on every main push by .github/workflows/docker-image.yml; the
  # first `up` pulls it (~9.5 GB, pull_policy below) instead of the 20-minute
  # local build. `docker compose build` (or `up --build`) still builds the
  # identical image under the same tag name. Immutable per-commit tags:
  # ghcr.io/syv-ai/qwen38-27b-rtx3090:sha-<7>.
  image: ghcr.io/syv-ai/qwen38-27b-rtx3090:latest
  build: .
  pull_policy: missing
  ipc: host
  env_file:
    - path: .env
      required: false
  environment:
    HOME: /cache
  volumes:
    - ${MODELS_DIR:-./models}:/app/models
    - qwen-cache:/cache

x-serve: &serve
  <<: *qwen
  ports:
    - "${BIND:-127.0.0.1}:${PORT:-18020}:${PORT:-18020}"
  depends_on:
    prepare:
      condition: service_completed_successfully
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
  restart: unless-stopped
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://127.0.0.1:${PORT:-18020}/health"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 900s   # first start: torch.compile + CUDA graphs + FlashInfer JIT

services:
  prepare:
    <<: *qwen
    command: prepare

  single:
    <<: *serve
    profiles: [single]
    command: single

  batch:
    <<: *serve
    profiles: [batch]
    command: batch

  # KAT-Coder-V2.5-Dev (Kwaipilot; MoE 35B-A3B, base Qwen3.6-35B-A3B) served as
  # IQ4_XS GGUF (18.81 GB, bartowski) by llama.cpp — vLLM does not speak IQ quants.
  # `make` (or `make kat`) downloads the GGUF once and starts this. Same port and
  # BIND/API-key conventions as the Qwen services; OpenAI-compatible API only
  # (no Anthropic /v1/messages). One GPU: kat, single and batch are exclusive.
  # Knobs from .env: KAT_CTX (default 16384), KAT_CPU_MOE (expert layers kept on
  # CPU, default 0 — raise it if the card is also driving a desktop and boot OOMs).
  kat:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    profiles: [kat]
    ipc: host
    ports:
      - "${BIND:-127.0.0.1}:${PORT:-18020}:${PORT:-18020}"
    volumes:
      - ${MODELS_DIR:-./models}/gguf:/models:ro
      - ./templates:/templates:ro
    environment:
      LLAMA_API_KEY: ${VLLM_API_KEY:-}
    command: >
      -m /models/Kwaipilot_KAT-Coder-V2.5-Dev-IQ4_XS.gguf
      --host 0.0.0.0 --port ${PORT:-18020}
      --alias kat-coder-v2.5
      -ngl 999 -c ${KAT_CTX:-16384}
      --cache-type-k ${KAT_KV:-q8_0} --cache-type-v ${KAT_KV:-q8_0}
      --n-cpu-moe ${KAT_CPU_MOE:-0}
      --parallel ${KAT_SLOTS:-1}
      ${KAT_ROPE_ARGS:-}
      --jinja
      --chat-template-file /templates/kat.jinja
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  qwen-cache:
